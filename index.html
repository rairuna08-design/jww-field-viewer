<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#174d43" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <title>JWW 図面・測定</title>
  <script type="module" crossorigin src="./assets/index-DjSidt-f.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-BGZ9-1XZ.css">
</head>
<body>
  <div id="app">
    <header class="topbar"><div><p class="eyebrow">現場ツール</p><h1>JWW 図面・測定</h1></div><label class="open-button">ファイルを開く<input id="file" type="file" accept=".jww,application/octet-stream" /></label></header>
    <main class="workspace">
      <canvas id="drawing" aria-label="JWW図面。測定モードで2点をタップ" tabindex="0"></canvas>
      <div id="empty"><span class="drawing-icon">⌖</span><h2>図面を開いて、測る。</h2><p>iPhoneの「ファイル」から<br>JWW図面を選択してください。</p><p class="privacy">図面は端末内で処理します。</p></div>
      <div id="file-info" class="file-info" hidden></div>
      <div class="view-controls"><button id="zoom-in" aria-label="拡大" disabled>＋</button><button id="zoom-out" aria-label="縮小" disabled>−</button><button id="fit" aria-label="図面全体を表示" disabled>全体</button></div>
      <div class="pan-controls" aria-label="上下の表示位置"><button id="pan-up" aria-label="図面の上の部分を見る" disabled>↑ 上を見る</button><button id="pan-down" aria-label="図面の下の部分を見る" disabled>↓ 下を見る</button></div>
    </main>
    <section class="measurement" aria-label="測定結果"><div class="result-row"><div><p id="scale-status">自動［未選択］</p><output id="result">— <small>mm</small></output></div><button id="reset" disabled>やり直す</button></div><p id="message" role="status" aria-live="polite">図面を開くと、表示・測定できます。</p></section>
    <footer class="toolbar"><div class="mode-switch"><button id="view" aria-pressed="true">見る</button><button id="measure" aria-pressed="false" disabled>測る</button></div><label class="scale-label">縮尺<select id="scale" aria-label="測定の縮尺"><option value="auto">自動</option><option value="20">1/20</option><option value="25">1/25</option><option value="30">1/30</option><option value="50">1/50</option><option value="100">1/100</option><option value="200">1/200</option><option value="500">1/500</option></select></label></footer>
  </div>
</body>
</html>
